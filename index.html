<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aurelia Gold Casino — VIP Стол</title>
  <style>
    :root {
      --gold-light: #fff3b0;
      --gold-main: #d4af37;
      --gold-dark: #7a5c12;
      --bg-dark: #0a0805;
      --panel-bg: #18120a;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #291e0e 0%, var(--bg-dark) 100%);
      color: var(--gold-light);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 4, 2, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-box {
      background: var(--panel-bg);
      border: 2px solid var(--gold-main);
      border-radius: 16px;
      padding: 22px;
      width: 100%;
      max-width: 390px;
      text-align: center;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.35);
    }

    .gold-input {
      width: 100%;
      padding: 10px 12px;
      margin: 7px 0;
      border-radius: 8px;
      border: 1px solid var(--gold-main);
      background: #0d0a06;
      color: var(--gold-light);
      font-size: 15px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(180deg, #2e2210 0%, #120d06 100%);
      border-bottom: 2px solid var(--gold-main);
      box-shadow: 0 4px 25px rgba(212, 175, 55, 0.25);
    }

    .logo {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(45deg, #b8860b, #fff8dc, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1.5px;
    }

    .mode-group { display: flex; gap: 6px; flex-wrap: wrap; }

    .gold-btn {
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-main) 50%, var(--gold-dark) 100%);
      border: 1px solid #fff;
      color: #140e03;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
    }

    .gold-btn.active { outline: 2px solid #fff; box-shadow: 0 0 15px var(--gold-light); }
    .gold-btn.danger { background: linear-gradient(180deg, #ff8a80, #c62828); color: #fff; border-color: #ffcdd2; }
    .gold-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .main-container {
      display: flex;
      padding: 12px;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: var(--panel-bg);
      border: 2px solid var(--gold-main);
      border-radius: 16px;
      padding: 14px;
      width: 100%;
      max-width: 540px;
      box-shadow: inset 0 0 25px rgba(212, 175, 55, 0.12), 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    canvas {
      border-radius: 50%;
      display: block;
      margin: 0 auto;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.45);
    }

    .board-scroll { overflow-x: auto; padding-bottom: 6px; }

    .table-grid {
      display: grid;
      grid-template-columns: 44px repeat(12, minmax(34px, 1fr));
      gap: 3px;
      min-width: 480px;
      margin-bottom: 10px;
    }

    .cell {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--gold-main);
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    .cell.red { background: linear-gradient(135deg, #801313, #420505); }
    .cell.black { background: linear-gradient(135deg, #24201b, #0c0a08); }
    .cell.green { background: linear-gradient(135deg, #1b5e20, #09260b); }

    .zero-col { grid-column: 1; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 3px; }
    .zero-col .cell { flex: 1; }

    .outside-bets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

    .chip-badge {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 10%, var(--gold-main) 65%, var(--gold-dark) 100%);
      color: #000;
      font-size: 9px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px dashed #fff;
      pointer-events: none;
    }

    .voice-controls { display: flex; gap: 8px; margin-top: 8px; }
    .voice-controls button { flex: 1; }
  </style>
</head>
<body>

  <!-- Окно входа -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <div class="logo" style="font-size: 21px; margin-bottom: 8px;">✦ AURELIA GOLD VIP ✦</div>
      <p style="font-size: 13px; opacity: 0.85; margin-top: 0;">Приватный стол (до 6 игроков + голосовой звонок)</p>
      <input type="text" id="inputName" class="gold-input" placeholder="Ваше имя" maxlength="15">
      <input type="text" id="inputRoom" class="gold-input" placeholder="Код комнаты (например: GOLD77)">
      <input type="password" id="inputPass" class="gold-input" placeholder="Пароль комнаты (необязательно)">
      <div id="loginError" style="color: #ffd54f; font-size: 13px; min-height: 20px; margin: 4px 0;"></div>

      <div style="display: flex; gap: 8px; margin-top: 6px;">

      </div>

  </div>

  <header>
    <div class="logo">✦ AURELIA GOLD VIP ✦</div>
    <div class="mode-group">
      <button id="btn-EU" class="gold-btn active" onclick="requestMode('EU')">Европейская</button>
      <button id="btn-US" class="gold-btn" onclick="requestMode('US')">Американская</button>
      <button id="btn-FR" class="gold-btn" onclick="requestMode('FR')">Французская</button>
    </div>
    <div style="font-size: 14px;">Баланс: <strong id="balance">10000</strong> 🪙</div>
  </header>

  <div class="main-container">
    <div class="card" style="text-align: center;">
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
      <div id="statusText" style="margin: 10px 0; font-weight: bold; font-size: 16px;">Сделайте ставку на столе</div>
      <button class="gold-btn" id="spinBtn" onclick="requestSpin()">КРУТИТЬ БАРАБАН</button>
      <button class="gold-btn" onclick="clearBets()">Сброс</button>
    </div>

    <div class="card">
      <div style="margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 12px;">
        <span>Фишка: <strong>100 🪙</strong></span>
        <span id="ruleHint">Европейская (одно зеро)</span>
      </div>
      <div class="board-scroll">
        <div class="table-grid" id="tableGrid"></div>
      </div>
      <div class="outside-bets">
        <div class="cell red" data-bet="RED" onclick="placeBet('RED')">КРАСНОЕ (x2)</div>
        <div class="cell green" data-bet="EVEN" onclick="placeBet('EVEN')">ЧЁТНОЕ (x2)</div>
        <div class="cell black" data-bet="BLACK" onclick="placeBet('BLACK')">ЧЁРНОЕ (x2)</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin: 0 0 10px 0; border-bottom: 1px solid var(--gold-dark); padding-bottom: 6px; font-size: 16px; display: flex; justify-content: space-between; align-items: center;">
        <span>Комната <span id="roomTitle"></span> (<span id="playerCount">1</span>/6)</span>
        <span id="netStatus" style="font-size: 12px; color: #4caf50;">🟢 Прямой поток</span>
      </h3>
      <div id="playersList"></div>
      <button class="gold-btn" style="width: 100%; margin-top: 6px;" onclick="copyRoomLink()">🔗 Скопировать приглашение</button>

      <div class="voice-controls">
        <button class="gold-btn" id="callBtn" onclick="joinVoiceCall()">📞 Войти в звонок</button>
        <button class="gold-btn" id="muteBtn" onclick="toggleMute()" disabled>🎙️ Микрофон: ВКЛ</button>
      </div>
      <div id="voiceStatus" style="font-size: 12px; color: #ffd54f; margin-top: 6px; text-align: center;"></div>
      <div id="audioContainer"></div>
    </div>
  </div>

<script>
const EU_NUMBERS = "0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26".split(',').map(Number);
const US_NUMBERS = "0,28,9,26,30,11,7,20,32,17,5,22,34,15,3,24,36,13,1,00,27,10,25,29,12,8,19,31,18,6,21,33,16,4,23,35,14,2".split(',').map(v => v === '00' ? '00' : Number(v));
const RED_NUMS = new Set("1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36".split(',').map(Number));

let currentMode = 'EU';
let wheelNumbers = EU_NUMBERS;
let balance = 10000;
let bets = {};
let wheelAngle = 0;
let ballAngle = -Math.PI / 2;
let ballRadius = 124;
let isSpinning = false;
let lastSpinId = 0;

let isHost = false;
let hostPassword = '';
let currentRoomId = '';
let myName = '';
const myId = 'u-' + Math.random().toString(36).substring(2, 9);
const myJoinedAt = Date.now();

const playersMap = new Map();
let eventStream = null;
let heartbeatTimer = null;
let seenMsgIds = new Set();

const RELAY_BASE = atob('aHR0cHM6Ly9udGZ5LnNoL2F1cmVsaWFfdmlwX3YyNF8=');

const urlParams = new URLSearchParams(window.location.search);
const linkRoom = urlParams.get('room');
document.getElementById('inputRoom').value = linkRoom || Math.random().toString(36).substring(2, 7).toUpperCase();
document.getElementById('inputName').value = 'VIP-' + Math.floor(100 + Math.random() * 900);

function setLoginStatus(text) {
  const el = document.getElementById('loginError');
  if (el) el.innerText = text;
}

function setVoiceStatus(text) {
  const el = document.getElementById('voiceStatus');
  if (el) el.innerText = text;
}

function updateNetBadge(ok) {
  const el = document.getElementById('netStatus');
  if (!el) return;
  el.innerText = ok ? '🟢 Прямой поток' : '🟡 Переподключение...';
  el.style.color = ok ? '#4caf50' : '#ffd54f';
}

function getTotalBetAmount(betObj) {
  let sum = 0;
  for (let k in betObj) sum += betObj[k];
  return sum;
}

function getActivePlayersList() {
  const now = Date.now();
  const list = new Array();
  playersMap.forEach((p, id) => {
    if (id === myId || (now - p.lastSeen < 180000)) {
      list.push(p);
    }
  });
  list.sort((a, b) => (b.isHost ? 1 : 0) - (a.isHost ? 1 : 0) || (a.joinedAt - b.joinedAt));
  return list.slice(0, 6);
}

async function postPacket(payloadObj, retries = 3) {
  if (!currentRoomId) return false;
  const bodyStr = JSON.stringify({ ...payloadObj, from: myId, ts: Date.now() });

  for (let attempt = 0; attempt < retries; attempt++) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);
      const res = await fetch(RELAY_BASE + currentRoomId, {
        method: 'POST',
        body: bodyStr,
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (res.ok) {
        updateNetBadge(true);
        return true;
      }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 350 * (attempt + 1)));
  }
  return false;
}

async function fetchHistory(since) {
  if (!currentRoomId) return new Array();
  try {
    const res = await fetch(`${RELAY_BASE}${currentRoomId}/json?poll=1&since=${since}`);
    if (!res.ok) return new Array();
    const text = await res.text();
    const lines = text.trim().split('\n');
    const packets = new Array();
    for (let line of lines) {
      if (!line) continue;
      try {
        const wrapper = JSON.parse(line);
        if (wrapper.id && seenMsgIds.has(wrapper.id)) continue;
        if (wrapper.id) seenMsgIds.add(wrapper.id);
        if (wrapper.message) {
          packets.push(JSON.parse(wrapper.message));
        }
      } catch (e) {}
    }
    return packets;
  } catch (e) {
    return new Array();
  }
}

function startLiveStream(since = '30s') {
  if (eventStream) {
    try { eventStream.close(); } catch (e) {}
  }

  eventStream = new EventSource(`${RELAY_BASE}${currentRoomId}/sse?since=${since}`);

  eventStream.onopen = () => {
    updateNetBadge(true);
  };

  eventStream.onmessage = (e) => {
    updateNetBadge(true);
    try {
      const wrapper = JSON.parse(e.data);
      if (wrapper.id && seenMsgIds.has(wrapper.id)) return;
      if (wrapper.id) {
        seenMsgIds.add(wrapper.id);
        if (seenMsgIds.size > 500) {
          const first = seenMsgIds.values().next().value;
          seenMsgIds.delete(first);
        }
      }
      if (wrapper.message) {
        const msg = JSON.parse(wrapper.message);
        if (msg.from === myId) return;
        handleIncomingMessage(msg);
      }
    } catch (err) {}
  };

  eventStream.onerror = () => {
    updateNetBadge(false);
  };
}

// 1. Создать комнату (Хост)
async function startAsHost() {
  myName = document.getElementById('inputName').value.trim() || 'Хост';
  currentRoomId = (document.getElementById('inputRoom').value.trim() || 'GOLD77').toUpperCase();
  hostPassword = document.getElementById('inputPass').value;
  isHost = true;

  setLoginStatus('⏳ Создание комнаты #' + currentRoomId + '...');
  document.getElementById('createBtn').disabled = true;
  document.getElementById('joinBtn').disabled = true;

  const ok = await postPacket({
    type: 'HOST_META',
    password: hostPassword,
    mode: currentMode
  }, 3);

  document.getElementById('createBtn').disabled = false;
  document.getElementById('joinBtn').disabled = false;

  if (!ok) {
    setLoginStatus('❌ Нет доступа к интернету. Проверьте сеть.');
    return;
  }

  setLoginStatus('');
  enterTable();
  startLiveStream('10s');
  sendMyCard();
  startHeartbeat();
}

// 2. Войти в комнату друга (Гость)
async function joinAsGuest() {
  myName = document.getElementById('inputName').value.trim() || 'Игрок';
  currentRoomId = (document.getElementById('inputRoom').value.trim() || '').toUpperCase();
  isHost = false;

  if (!currentRoomId) {
    setLoginStatus('❌ Введите код комнаты друга!');
    return;
  }

  setLoginStatus('⏳ Поиск комнаты #' + currentRoomId + '...');
  document.getElementById('createBtn').disabled = true;
  document.getElementById('joinBtn').disabled = true;

  const packets = await fetchHistory('15m');
  let hostMeta = null;

  for (let msg of packets) {
    if (msg.type === 'HOST_META') hostMeta = msg;
    if (msg.type === 'CARD' && msg.card) {
      msg.card.lastSeen = Date.now();
      playersMap.set(msg.card.id, msg.card);
    }
    if (msg.type === 'SPIN_GO' && msg.spinId) {
      lastSpinId = msg.spinId;
    }
  }

  document.getElementById('createBtn').disabled = false;
  document.getElementById('joinBtn').disabled = false;

  if (!hostMeta) {
    setLoginStatus('❌ Комната #' + currentRoomId + ' не найдена! Проверьте код.');
    return;
  }

  const enteredPass = document.getElementById('inputPass').value;
  if (hostMeta.password && hostMeta.password !== enteredPass) {
    setLoginStatus('❌ Неверный пароль от комнаты!');
    return;
  }

  if (getActivePlayersList().length >= 6 && !playersMap.has(myId)) {
    setLoginStatus('❌ В комнате уже максимум (6 игроков)!');
    return;
  }

  setLoginStatus('');
  applyModeUI(hostMeta.mode || 'EU');
  enterTable();
  startLiveStream('15s');
  sendMyCard();
  startHeartbeat();
}

function sendMyCard() {
  const myCard = {
    id: myId,
    name: myName,
    isHost: isHost,
    joinedAt: myJoinedAt,
    balance: balance,
    currentBet: getTotalBetAmount(bets),
    betsMap: { ...bets },
    inCall: Boolean(localStream),
    muted: isMuted,
    lastSeen: Date.now()
  };
  playersMap.set(myId, myCard);
  renderPlayersTable();
  renderAllChipsOnBoard();
  postPacket({ type: 'CARD', card: myCard }, 3);
}

function startHeartbeat() {
  clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(() => {
    sendMyCard();
    if (isHost) {
      postPacket({ type: 'HOST_META', password: hostPassword, mode: currentMode }, 2);
    }
  }, 15000);
}

document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && currentRoomId && document.getElementById('loginModal').style.display === 'none') {
    const missed = await fetchHistory('2m');
    for (let msg of missed) {
      if (msg.from !== myId) handleIncomingMessage(msg);
    }
    startLiveStream('15s');
    sendMyCard();
  }
});

function handleIncomingMessage(msg) {
  if (msg.type === 'CARD' && msg.card) {
    if (msg.card.left) {
      playersMap.delete(msg.card.id);
      closePeer(msg.card.id);
    } else {
      msg.card.lastSeen = Date.now();
      playersMap.set(msg.card.id, msg.card);
      // Если мы уже в голосовом звонке и видим другого игрока в звонке без активного пира — соединяемся
      if (localStream && msg.card.inCall && !peers[msg.card.id] && myId > msg.card.id) {
        createVoicePeer(msg.card.id, true);
      }
    }
    renderPlayersTable();
    renderAllChipsOnBoard();
  } else if (msg.type === 'HOST_META' && !isHost) {
    if (msg.mode && msg.mode !== currentMode && !isSpinning) {
      applyModeUI(msg.mode);
    }
  } else if (msg.type === 'MODE_SET' && !isHost) {
    if (!isSpinning) applyModeUI(msg.mode);
  } else if (msg.type === 'SPIN_GO' && !isHost) {
    if (msg.spinId && msg.spinId !== lastSpinId) {
      lastSpinId = msg.spinId;
      runSpinAnimation(msg.winningIndex);
    }
  }

  // Сигналы WebRTC для голосового звонка
  if (msg.to === myId) {
    if (msg.type === 'RTC_OFFER') handleReceiveOffer(msg.from, msg.offer);
    else if (msg.type === 'RTC_ANSWER') handleReceiveAnswer(msg.from, msg.answer);
    else if (msg.type === 'RTC_ICE') handleReceiveIce(msg.from, msg.candidate);
  }
  if (msg.type === 'VOICE_JOINED' && localStream && msg.from !== myId) {
    // Чтобы не было двойного вызова, звонок инициирует участник с большим ID
    if (myId > msg.from) {
      createVoicePeer(msg.from, true);
    }
  }
}

window.addEventListener('beforeunload', () => {
  if (eventStream) {
    try { eventStream.close(); } catch (e) {}
  }
  navigator.sendBeacon?.(RELAY_BASE + currentRoomId, JSON.stringify({
    type: 'CARD',
    from: myId,
    card: { id: myId, left: true }
  }));
});

function enterTable() {
  window.history.replaceState({}, '', `?room=${currentRoomId}`);
  document.getElementById('roomTitle').innerText = `#${currentRoomId}`;
  document.getElementById('loginModal').style.display = 'none';

  const spinBtn = document.getElementById('spinBtn');
  if (!isHost) {
    spinBtn.disabled = true;
    spinBtn.innerText = '👑 ЖДЁМ ХОСТА';
    document.querySelectorAll('.mode-group .gold-btn').forEach(btn => {
      btn.disabled = true;
    });
  } else {
    spinBtn.disabled = false;
    spinBtn.innerText = 'КРУТИТЬ БАРАБАН';
  }

  renderPlayersTable();
  renderAllChipsOnBoard();
  drawWheel();
}

function renderPlayersTable() {
  const activeList = getActivePlayersList();
  document.getElementById('playerCount').innerText = activeList.length;
  const list = document.getElementById('playersList');

  let html = `
    <table style="width:100%; border-collapse:collapse; font-size:12px; text-align:left;">
      <thead>
        <tr style="border-bottom:1px solid #d4af37; color:#fff3b0;">
          <th style="padding:6px 4px;">Игрок</th>
          <th style="padding:6px 4px;">Баланс</th>
          <th style="padding:6px 4px;">Ставка</th>
          <th style="padding:6px 4px; text-align:right;">Звонок</th>
        </tr>
      </thead>
      <tbody>
  `;

  activeList.forEach((p) => {
    const isMe = p.id === myId;
    let voiceIcon = '💬';
    if (p.inCall) voiceIcon = p.muted ? '🔇' : '🔊';

    html += `
      <tr style="border-bottom:1px solid rgba(212,175,55,0.25); background:${isMe ? 'rgba(212,175,55,0.12)' : 'transparent'};">
        <td style="padding:7px 4px; font-weight:${isMe ? 'bold' : 'normal'};">
          ${p.isHost ? '👑' : '🎲'} ${p.name} ${isMe ? '(Вы)' : ''}
        </td>
        <td style="padding:7px 4px; color:#fff3b0;">${p.balance} 🪙</td>
        <td style="padding:7px 4px; color:${p.currentBet > 0 ? '#4caf50' : '#888'}; font-weight:bold;">
          ${p.currentBet > 0 ? p.currentBet + ' 🪙' : '—'}
        </td>
        <td style="padding:7px 4px; text-align:right;">${voiceIcon}</td>
      </tr>
    `;
  });

  for (let i = activeList.length; i < 6; i++) {
    html += `
      <tr style="border-bottom:1px dashed rgba(212,175,55,0.2); opacity:0.45;">
        <td colspan="4" style="padding:6px 4px;">Место #${i + 1} свободно</td>
      </tr>
    `;
  }

  html += `</tbody></table>`;
  list.innerHTML = html;
}

function renderAllChipsOnBoard() {
  document.querySelectorAll('.chip-badge').forEach(b => b.remove());

  const combinedBets = {};
  getActivePlayersList().forEach(p => {
    const map = (p.id === myId) ? bets : (p.betsMap || {});
    for (let target in map) {
      if (map[target] > 0) {
        if (!combinedBets[target]) combinedBets[target] = { total: 0, hasMine: false, hasOthers: false };
        combinedBets[target].total += map[target];
        if (p.id === myId) combinedBets[target].hasMine = true;
        else combinedBets[target].hasOthers = true;
      }
    }
  });

  for (let target in combinedBets) {
    const cell = document.querySelector(`.cell[data-bet="${target}"]`);
    if (cell) {
      const info = combinedBets[target];
      const badge = document.createElement('div');
      badge.className = 'chip-badge';
      badge.innerText = info.total;
      if (!info.hasMine && info.hasOthers) {
        badge.style.background = 'radial-gradient(circle, #fff 10%, #4fc3f7 65%, #0277bd 100%)';
      }
      cell.appendChild(badge);
    }
  }
}

function requestMode(mode) {
  if (!isHost || isSpinning) return;
  applyModeUI(mode);
  postPacket({ type: 'MODE_SET', mode }, 3);
  postPacket({ type: 'HOST_META', password: hostPassword, mode: currentMode }, 2);
}

function applyModeUI(mode) {
  currentMode = mode;
  wheelNumbers = (mode === 'US') ? US_NUMBERS : EU_NUMBERS;
  document.querySelectorAll('.mode-group .gold-btn').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById('btn-' + mode);
  if (activeBtn) activeBtn.classList.add('active');

  const hints = {
    'EU': 'Европейская (одно зеро)',
    'US': 'Американская (0 и 00)',
    'FR': 'Французская (La Partage: 50% при 0)'
  };
  document.getElementById('ruleHint').innerText = hints[mode] || '';
  buildBoard();
  renderAllChipsOnBoard();
  drawWheel();
}

function buildBoard() {
  const grid = document.getElementById('tableGrid');
  if (!grid) return;
  grid.innerHTML = '';

  const zeroCol = document.createElement('div');
  zeroCol.className = 'zero-col';
  zeroCol.appendChild(createCell('0', 'green'));
  if (currentMode === 'US') zeroCol.appendChild(createCell('00', 'green'));
  grid.appendChild(zeroCol);

  for (let row = 3; row >= 1; row--) {
    for (let col = 0; col < 12; col++) {
      const num = col * 3 + row;
      grid.appendChild(createCell(String(num), RED_NUMS.has(num) ? 'red' : 'black'));
    }
  }
}

function createCell(label, cls) {
  const div = document.createElement('div');
  div.className = `cell ${cls}`;
  div.setAttribute('data-bet', label);
  div.innerText = label;
  div.onclick = () => placeBet(label);
  return div;
}

function placeBet(target) {
  if (isSpinning || balance < 100) return;
  balance -= 100;
  bets[target] = (bets[target] || 0) + 100;
  document.getElementById('balance').innerText = balance;
  sendMyCard();
}

function clearBets() {
  if (isSpinning) return;
  for (let k in bets) balance += bets[k];
  bets = {};
  document.getElementById('balance').innerText = balance;
  sendMyCard();
}

function drawWheel() {
  const canvas = document.getElementById('wheelCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const cx = 150, cy = 150, r = 132;
  const arc = (2 * Math.PI) / wheelNumbers.length;

  ctx.clearRect(0, 0, 300, 300);

  ctx.beginPath();
  ctx.arc(cx, cy, r + 14, 0, 2 * Math.PI);
  const rimGrad = ctx.createLinearGradient(0, 0, 300, 300);
  rimGrad.addColorStop(0, '#fff3b0');
  rimGrad.addColorStop(0.5, '#d4af37');
  rimGrad.addColorStop(1, '#7a5c12');
  ctx.fillStyle = rimGrad;
  ctx.fill();

  wheelNumbers.forEach((num, i) => {
    const a = wheelAngle + i * arc;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a, a + arc);
    ctx.fillStyle = (num === 0 || num === '00') ? '#1b5e20' : (RED_NUMS.has(num) ? '#7a1212' : '#14110d');
    ctx.fill();
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx + Math.cos(a + arc / 2) * (r - 17), cy + Math.sin(a + arc / 2) * (r - 17));
    ctx.rotate(a + arc / 2 + Math.PI / 2);
    ctx.fillStyle = '#fff3b0';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(String(num), 0, 0);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx, cy, 42, 0, 2 * Math.PI);
  const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, 42);
  grad.addColorStop(0, '#fff8dc');
  grad.addColorStop(0.6, '#d4af37');
  grad.addColorStop(1, '#5e4308');
  ctx.fillStyle = grad;
  ctx.fill();

  const bx = cx + Math.cos(ballAngle) * ballRadius;
  const by = cy + Math.sin(ballAngle) * ballRadius;
  ctx.beginPath();
  ctx.arc(bx, by, 6, 0, 2 * Math.PI);
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 5;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function requestSpin() {
  if (!isHost || isSpinning) return;
  const winningIndex = Math.floor(Math.random() * wheelNumbers.length);
  const spinId = Date.now() + Math.floor(Math.random() * 10000);
  lastSpinId = spinId;

  postPacket({ type: 'SPIN_GO', winningIndex, spinId }, 3);
  runSpinAnimation(winningIndex);
}

function runSpinAnimation(winningIndex) {
  if (isSpinning) return;
  isSpinning = true;
  if (isHost) document.getElementById('spinBtn').disabled = true;
  document.getElementById('statusText').innerText = 'Шарик запущен...';

  const arc = (2 * Math.PI) / wheelNumbers.length;
  const duration = 4500;
  const startTime = performance.now();
  const startWheel = wheelAngle;
  const targetWheel = startWheel + Math.PI * 10;

  const finalSectorAngle = targetWheel + winningIndex * arc + arc / 2;
  const startBall = ballAngle;
  const totalBallDelta = (finalSectorAngle - startBall) - Math.PI * 14;

  function animate(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);

    wheelAngle = startWheel + (targetWheel - startWheel) * ease;
    ballAngle = startBall + totalBallDelta * ease;
    ballRadius = t < 0.5 ? 124 : 124 - ((t - 0.5) / 0.5) * 26;

    drawWheel();
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      isSpinning = false;
      if (isHost) document.getElementById('spinBtn').disabled = false;
      finishRound(wheelNumbers[winningIndex]);
    }
  }
  requestAnimationFrame(animate);
}

function finishRound(winNum) {
  let winAmount = 0;
  const isZero = (winNum === 0 || winNum === '00');
  const isRed = !isZero && RED_NUMS.has(winNum);

  for (let target in bets) {
    const amt = bets[target];
    if (target === String(winNum)) winAmount += amt * 36;
    else if (target === 'RED' && isRed) winAmount += amt * 2;
    else if (target === 'BLACK' && !isZero && !isRed) winAmount += amt * 2;
    else if (target === 'EVEN' && !isZero && winNum % 2 === 0) winAmount += amt * 2;
    else if (currentMode === 'FR' && winNum === 0 && ['RED', 'BLACK', 'EVEN'].includes(target)) {
      winAmount += amt * 0.5;
    }
  }

  balance += winAmount;
  document.getElementById('balance').innerText = balance;
  document.getElementById('statusText').innerText = `Выпало: ${winNum}! Выигрыш: ${winAmount} 🪙`;
  bets = {};
  sendMyCard();
}

// === ИСПРАВЛЕННЫЙ ГОЛОСОВОЙ ЧАТ (WebRTC + STUN/TURN + разблокировка звука iOS) ===
let localStream = null;
let isMuted = false;
const peers = {};
const pendingIce = {};

// Рабочие STUN и бесплатные TURN-серверы OpenRelay для связи между мобильными сетями и Wi-Fi
const rtcConfig = {
  iceServers: [
    { urls: 'stun:google.com' },
    { urls: 'stun:google.com' },
    { urls: 'stun:stun.yandex.ru:3478' },
    {
      urls: 'turn:openrelay.metered.ca:80',
      username: 'openrelayproject',
      credential: 'openrelayproject'
    },
    {
      urls: 'turn:openrelay.metered.ca:443',
      username: 'openrelayproject',
      credential: 'openrelayproject'
    }
  ]
};

async function joinVoiceCall() {
  if (localStream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Голосовой звонок поддерживается только по защищённому соединению HTTPS.');
    return;
  }

  setVoiceStatus('⏳ Запрос доступа к микрофону...');
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    // Разблокируем аудиодвижок Safari по клику пользователя
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      const ctx = new AudioCtx();
      if (ctx.state === 'suspended') await ctx.resume();
    }

    isMuted = false;
    document.getElementById('callBtn').innerText = '🟢 В звонке';
    document.getElementById('callBtn').disabled = true;
    document.getElementById('muteBtn').disabled = false;
    setVoiceStatus('🎙️ Вы в голосовом канале');

    postPacket({ type: 'VOICE_JOINED' }, 3);
    sendMyCard();

    // Подключаемся ко всем, кто уже находится в голосовом канале
    getActivePlayersList().forEach(p => {
      if (p.id !== myId && p.inCall && myId > p.id) {
        createVoicePeer(p.id, true);
      }
    });
  } catch (e) {
    setVoiceStatus('');
    alert('Не удалось включить микрофон. Разрешите доступ к микрофону в настройках браузера.');
  }
}

function createVoicePeer(remoteId, initiator) {
  if (peers[remoteId]) return peers[remoteId];
  const pc = new RTCPeerConnection(rtcConfig);
  peers[remoteId] = pc;
  pendingIce[remoteId] = new Array();

  if (localStream) {
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      postPacket({ type: 'RTC_ICE', to: remoteId, candidate: e.candidate }, 2);
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      setVoiceStatus('🔊 Голосовая связь установлена');
    } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      closePeer(remoteId);
      setVoiceStatus('🟡 Переподключение голоса...');
    }
  };

  pc.ontrack = (e) => {
    let audio = document.getElementById('audio-' + remoteId);
    if (!audio) {
      audio = document.createElement('audio');
      audio.id = 'audio-' + remoteId;
      audio.autoplay = true;
      audio.playsInline = true;
      audio.controls = false;
      document.getElementById('audioContainer').appendChild(audio);
    }

    if (e.streams && e.streams.length > 0) {
      audio.srcObject = e.streams.at(0);
    } else {
      const stream = new MediaStream();
      stream.addTrack(e.track);
      audio.srcObject = stream;
    }

    // Принудительный запуск воспроизведения для мобильных браузеров
    audio.play().catch(() => {
      setVoiceStatus('🔇 Нажмите в любое место экрана, чтобы включить звук собеседника');
      const unlock = () => {
        audio.play().catch(() => {});
        setVoiceStatus('🔊 Голосовая связь установлена');
        document.removeEventListener('touchstart', unlock);
        document.removeEventListener('click', unlock);
      };
      document.addEventListener('touchstart', unlock);
      document.addEventListener('click', unlock);
    });
  };

  if (initiator) {
    pc.createOffer().then(offer => {
      return pc.setLocalDescription(offer);
    }).then(() => {
      postPacket({ type: 'RTC_OFFER', to: remoteId, offer: pc.localDescription }, 3);
    }).catch(() => {});
  }
  return pc;
}

async function handleReceiveOffer(from, offer) {
  if (!localStream) return;
  try {
    const pc = createVoicePeer(from, false);
    await pc.setRemoteDescription(new RTCSessionDescription(offer));

    if (pendingIce[from]) {
      for (let c of pendingIce[from]) {
        await pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
      }
      pendingIce[from] = new Array();
    }

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    postPacket({ type: 'RTC_ANSWER', to: from, answer: pc.localDescription }, 3);
  } catch (e) {}
}

async function handleReceiveAnswer(from, answer) {
  const pc = peers[from];
  if (!pc) return;
  try {
    await pc.setRemoteDescription(new RTCSessionDescription(answer));
    if (pendingIce[from]) {
      for (let c of pendingIce[from]) {
        await pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
      }
      pendingIce[from] = new Array();
    }
  } catch (e) {}
}

async function handleReceiveIce(from, candidate) {
  const pc = peers[from];
  if (!pc) return;
  try {
    if (pc.remoteDescription && pc.remoteDescription.type) {
      await pc.addIceCandidate(new RTCIceCandidate(candidate));
    } else {
      if (!pendingIce[from]) pendingIce[from] = new Array();
      pendingIce[from].push(candidate);
    }
  } catch (e) {}
}

function closePeer(remoteId) {
  if (peers[remoteId]) {
    try { peers[remoteId].close(); } catch (e) {}
    delete peers[remoteId];
  }
  delete pendingIce[remoteId];
  const el = document.getElementById('audio-' + remoteId);
  if (el) el.remove();
}

function toggleMute() {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => { t.enabled = !isMuted; });

  const btn = document.getElementById('muteBtn');
  if (isMuted) {
    btn.innerText = '🔇 Микрофон: ВЫКЛ';
    btn.classList.add('danger');
  } else {
    btn.innerText = '🎙️ Микрофон: ВКЛ';
    btn.classList.remove('danger');
  }
  sendMyCard();
}

function copyRoomLink() {
  const baseUrl = window.location.href.split('?').shift();
  const link = baseUrl + '?room=' + currentRoomId;
  navigator.clipboard?.writeText(link);
  alert(`Ссылка скопирована!\nКод комнаты: ${currentRoomId}`);
}

buildBoard();
drawWheel();
