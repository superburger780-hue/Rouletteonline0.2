<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aurelia Gold Casino — VIP Стол</title>
<style>
  :root {
    --gold-light: #fff3b0;
    --gold-main: #d4af37;
    --gold-dark: #7a5c12;
    --bg-dark: #0a0805;
    --panel-bg: #18120a;
  }

  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    margin: 0;
    background: radial-gradient(circle at top, #291e0e 0%, var(--bg-dark) 100%);
    color: var(--gold-light);
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: linear-gradient(180deg, #2e2210 0%, #120d06 100%);
    border-bottom: 2px solid var(--gold-main);
    box-shadow: 0 4px 25px rgba(212, 175, 55, 0.25);
  }

  .logo {
    font-size: 18px;
    font-weight: 800;
    background: linear-gradient(45deg, #b8860b, #fff8dc, #d4af37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1.5px;
  }

  .mode-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .gold-btn {
    background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-main) 50%, var(--gold-dark) 100%);
    border: 1px solid #fff;
    color: #140e03;
    font-weight: bold;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
  }

  .gold-btn.active { outline: 2px solid #fff; box-shadow: 0 0 15px var(--gold-light); }
  .gold-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .main-container {
    display: flex;
    padding: 12px;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .card {
    background: var(--panel-bg);
    border: 2px solid var(--gold-main);
    border-radius: 16px;
    padding: 14px;
    width: 100%;
    max-width: 540px;
    box-shadow: inset 0 0 25px rgba(212, 175, 55, 0.12), 0 10px 30px rgba(0,0,0,0.8);
  }

  canvas {
    border-radius: 50%;
    max-width: 100%;
    height: auto;
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.45);
  }

  /* Прокручиваемое поле на узких экранах */
  .board-scroll {
    overflow-x: auto;
    padding-bottom: 6px;
  }

  .table-grid {
    display: grid;
    grid-template-columns: 44px repeat(12, minmax(34px, 1fr));
    gap: 3px;
    min-width: 480px;
    margin-bottom: 10px;
  }

  .cell {
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--gold-main);
    border-radius: 4px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    position: relative;
    user-select: none;
  }

  .cell:active { transform: scale(0.95); }
  .cell.red { background: linear-gradient(135deg, #801313, #420505); }
  .cell.black { background: linear-gradient(135deg, #24201b, #0c0a08); }
  .cell.green { background: linear-gradient(135deg, #1b5e20, #09260b); }

  .zero-col { grid-column: 1; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 3px; }
  .zero-col .cell { flex: 1; }

  .outside-bets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

  .chip-badge {
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 10%, var(--gold-main) 65%, var(--gold-dark) 100%);
    color: #000;
    font-size: 9px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px dashed #fff;
    box-shadow: 0 2px 4px #000;
  }

  .player-slot {
    display: flex;
    justify-content: space-between;
    padding: 8px 10px;
    margin-bottom: 6px;
    border: 1px solid var(--gold-dark);
    border-radius: 8px;
    background: rgba(212, 175, 55, 0.06);
    font-size: 13px;
  }
  .player-slot.empty { opacity: 0.45; border-style: dashed; }
</style>
</head>
<body>

<header>
  <div class="logo">✦ AURELIA GOLD VIP ✦</div>
  <div class="mode-group">
    <button id="btn-EU" class="gold-btn active" onclick="requestMode('EU')">Европейская</button>
    <button id="btn-US" class="gold-btn" onclick="requestMode('US')">Американская</button>
    <button id="btn-FR" class="gold-btn" onclick="requestMode('FR')">Французская</button>
  </div>
  <div style="font-size:14px;">Баланс: <strong id="balance">10000</strong> 🪙</div>
</header>

<div class="main-container">
  <!-- Золотой барабан и шарик -->
  <div class="card" style="text-align:center;">
    <canvas id="wheelCanvas" width="320" height="320"></canvas>
    <div id="statusText" style="margin: 10px 0; font-weight: bold; font-size: 16px;">Сделайте ставку на столе</div>
    <button class="gold-btn" id="spinBtn" onclick="requestSpin()">КРУТИТЬ БАРАБАН</button>
    <button class="gold-btn" onclick="clearBets()">Сброс</button>
  </div>

  <!-- Игровое поле -->
  <div class="card">
    <div style="margin-bottom: 8px; display:flex; justify-content:space-between; font-size:12px;">
      <span>Фишка: <strong>100 🪙</strong></span>
      <span id="ruleHint">Европейская (одно зеро)</span>
    </div>
    <div class="board-scroll">
      <div class="table-grid" id="tableGrid"></div>
    </div>
    <div class="outside-bets">
      <div class="cell red" onclick="placeBet('RED', this)">КРАСНОЕ (x2)</div>
      <div class="cell green" onclick="placeBet('EVEN', this)">ЧЁТНОЕ (x2)</div>
      <div class="cell black" onclick="placeBet('BLACK', this)">ЧЁРНОЕ (x2)</div>
    </div>
  </div>

  <!-- VIP Комната (6 мест + Голосовой звонок) -->
  <div class="card">
    <h3 style="margin:0 0 10px 0; border-bottom:1px solid var(--gold-dark); padding-bottom:6px; font-size:16px;">
      VIP Комната (<span id="playerCount">1</span>/6)
    </h3>
    <div id="playersList"></div>
    <button class="gold-btn" style="width:100%; margin-top:6px;" onclick="copyRoomLink()">🔗 Пригласить друзей (до 6 чел.)</button>
    <button class="gold-btn" id="callBtn" style="width:100%; margin-top:8px;" onclick="joinVoiceCall()">📞 Войти в голосовой звонок</button>
    <div id="audioContainer"></div>
  </div>
</div>

<script>
// Полные последовательности секторов рулетки
const EU_NUMBERS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const US_NUMBERS = [0,28,9,26,30,11,7,20,32,17,5,22,34,15,3,24,36,13,1,'00',27,10,25,29,12,8,19,31,18,6,21,33,16,4,23,35,14,2];
const RED_NUMS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

let currentMode = 'EU';
let wheelNumbers = EU_NUMBERS;
let balance = 10000;
let bets = {};
let wheelAngle = 0;
let ballAngle = -Math.PI / 2;
let ballRadius = 132;
let isSpinning = false;
let socket = null;

// Подключение к серверу (если запущен) или локальный режим
const myName = 'VIP-' + Math.floor(100 + Math.random() * 900);
const urlParams = new URLSearchParams(window.location.search);
let roomId = urlParams.get('room') || Math.random().toString(36).substring(2, 8).toUpperCase();

function initNetwork() {
  if (typeof io !== 'undefined') {
    socket = io();
    socket.emit('join-room', { roomId, playerName: myName });
    socket.on('room-full', () => alert('Комната заполнена (максимум 6 игроков)!'));
    socket.on('room-state', ({ players, mode }) => {
      applyModeUI(mode);
      renderPlayersList(players);
    });
    socket.on('mode-updated', (mode) => applyModeUI(mode));
    socket.on('spin-started', ({ winningIndex }) => runSpinAnimation(winningIndex));
    setupWebRTCSignaling();
  } else {
    // Автономный режим для Preview без сервера
    renderPlayersList([{ id: 'local', name: myName }]);
  }
}

function renderPlayersList(players) {
  document.getElementById('playerCount').innerText = players.length;
  const list = document.getElementById('playersList');
  list.innerHTML = '';

  players.forEach((p, idx) => {
    const isMe = (socket && p.id === socket.id) || p.id === 'local';
    list.innerHTML += `
      <div class="player-slot">
        <span>${idx === 0 ? '👑' : '🎲'} ${p.name} ${isMe ? '(Вы)' : ''}</span>
        <span style="color:#4caf50;">● В игре</span>
      </div>`;
  });

  for (let i = players.length; i < 6; i++) {
    list.innerHTML += `<div class="player-slot empty"><span>Место #${i + 1} свободно</span></div>`;
  }
}

function requestMode(mode) {
  if (isSpinning) return;
  if (socket) socket.emit('change-mode', mode);
  else applyModeUI(mode);
}

function applyModeUI(mode) {
  currentMode = mode;
  wheelNumbers = (mode === 'US') ? US_NUMBERS : EU_NUMBERS;
  document.querySelectorAll('.mode-group .gold-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + mode).classList.add('active');

  const hints = {
    'EU': 'Европейская (одно зеро)',
    'US': 'Американская (0 и 00)',
    'FR': 'Французская (La Partage: 50% при 0)'
  };
  document.getElementById('ruleHint').innerText = hints[mode];
  buildBoard();
  drawWheel();
}

function buildBoard() {
  const grid = document.getElementById('tableGrid');
  grid.innerHTML = '';
  const zeroCol = document.createElement('div');
  zeroCol.className = 'zero-col';
  zeroCol.appendChild(createCell('0', 'green'));
  if (currentMode === 'US') zeroCol.appendChild(createCell('00', 'green'));
  grid.appendChild(zeroCol);

  for (let row = 3; row >= 1; row--) {
    for (let col = 0; col < 12; col++) {
      const num = col * 3 + row;
      grid.appendChild(createCell(String(num), RED_NUMS.has(num) ? 'red' : 'black'));
    }
  }
}

function createCell(label, cls) {
  const div = document.createElement('div');
  div.className = `cell ${cls}`;
  div.innerText = label;
  div.onclick = () => placeBet(label, div);
  return div;
}

function placeBet(target, el) {
  if (isSpinning || balance < 100) return;
  balance -= 100;
  bets[target] = (bets[target] || 0) + 100;
  document.getElementById('balance').innerText = balance;

  let badge = el.querySelector('.chip-badge');
  if (!badge) {
    badge = document.createElement('div');
    badge.className = 'chip-badge';
    el.appendChild(badge);
  }
  badge.innerText = bets[target];
}

function clearBets() {
  if (isSpinning) return;
  for (let k in bets) balance += bets[k];
  bets = {};
  document.getElementById('balance').innerText = balance;
  document.querySelectorAll('.chip-badge').forEach(b => b.remove());
}

// Отрисовка золотого барабана и шарика
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');

function drawWheel() {
  const cx = 160, cy = 160, r = 142;
  const arc = (2 * Math.PI) / wheelNumbers.length;
  ctx.clearRect(0, 0, 320, 320);

  // Внешний корпус из золота
  ctx.beginPath();
  ctx.arc(cx, cy, r + 14, 0, 2 * Math.PI);
  const rimGrad = ctx.createLinearGradient(0, 0, 320, 320);
  rimGrad.addColorStop(0, '#fff3b0');
  rimGrad.addColorStop(0.5, '#d4af37');
  rimGrad.addColorStop(1, '#7a5c12');
  ctx.fillStyle = rimGrad;
  ctx.fill();

  wheelNumbers.forEach((num, i) => {
    const a = wheelAngle + i * arc;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a, a + arc);
    ctx.fillStyle = (num === 0 || num === '00') ? '#1b5e20' : (RED_NUMS.has(num) ? '#7a1212' : '#14110d');
    ctx.fill();
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx + Math.cos(a + arc / 2) * (r - 18), cy + Math.sin(a + arc / 2) * (r - 18));
    ctx.rotate(a + arc / 2 + Math.PI / 2);
    ctx.fillStyle = '#fff3b0';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(num, 0, 0);
    ctx.restore();
  });

  // Золотая турель в центре
  ctx.beginPath();
  ctx.arc(cx, cy, 44, 0, 2 * Math.PI);
  const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, 44);
  grad.addColorStop(0, '#fff8dc');
  grad.addColorStop(0.6, '#d4af37');
  grad.addColorStop(1, '#5e4308');
  ctx.fillStyle = grad;
  ctx.fill();

  // Анимированный жемчужный шарик
  const bx = cx + Math.cos(ballAngle) * ballRadius;
  const by = cy + Math.sin(ballAngle) * ballRadius;
  ctx.beginPath();
  ctx.arc(bx, by, 6.5, 0, 2 * Math.PI);
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 5;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function requestSpin() {
  if (isSpinning) return;
  if (socket) {
    socket.emit('request-spin');
  } else {
    const winningIndex = Math.floor(Math.random() * wheelNumbers.length);
    runSpinAnimation(winningIndex);
  }
}

function runSpinAnimation(winningIndex) {
  isSpinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('statusText').innerText = 'Шарик запущен...';

  const arc = (2 * Math.PI) / wheelNumbers.length;
  const duration = 4500;
  const startTime = performance.now();
  const startWheel = wheelAngle;
  const targetWheel = startWheel + Math.PI * 10;

  const finalSectorAngle = targetWheel + winningIndex * arc + arc / 2;
  const startBall = ballAngle;
  const totalBallDelta = (finalSectorAngle - startBall) - Math.PI * 14;

  function animate(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);

    wheelAngle = startWheel + (targetWheel - startWheel) * ease;
    ballAngle = startBall + totalBallDelta * ease;
    ballRadius = t < 0.5 ? 132 : 132 - ((t - 0.5) / 0.5) * 28;

    drawWheel();
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      isSpinning = false;
      document.getElementById('spinBtn').disabled = false;
      finishRound(wheelNumbers[winningIndex]);
    }
  }
  requestAnimationFrame(animate);
}

function finishRound(winNum) {
  let winAmount = 0;
  const isZero = (winNum === 0 || winNum === '00');
  const isRed = !isZero && RED_NUMS.has(winNum);

  for (let target in bets) {
    const amt = bets[target];
    if (target === String(winNum)) winAmount += amt * 36;
    else if (target === 'RED' && isRed) winAmount += amt * 2;
    else if (target === 'BLACK' && !isZero && !isRed) winAmount += amt * 2;
    else if (target === 'EVEN' && !isZero && winNum % 2 === 0) winAmount += amt * 2;
    else if (currentMode === 'FR' && winNum === 0 && ['RED','BLACK','EVEN'].includes(target)) {
      winAmount += amt * 0.5;
    }
  }

  balance += winAmount;
  document.getElementById('balance').innerText = balance;
  document.getElementById('statusText').innerText = `Выпало: ${winNum}! Выигрыш: ${winAmount} 🪙`;
  bets = {};
  document.querySelectorAll('.chip-badge').forEach(b => b.remove());
}

// === ГОЛОСОВОЙ ЗВОНОК ===
let localStream = null;
const peers = {};
const rtcConfig = { iceServers: [{ urls: 'stun:google.com' }] };

async function joinVoiceCall() {
  if (localStream) return;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    document.getElementById('callBtn').innerText = '🟢 Микрофон включен (Звонок)';
    document.getElementById('callBtn').disabled = true;
    if (socket) socket.emit('join-room', { roomId, playerName: myName });
  } catch (e) {
    alert('Разрешите доступ к микрофону в настройках браузера.');
  }
}

function setupWebRTCSignaling() {
  socket.on('user-joined-voice', (remoteId) => {
    if (localStream && !peers[remoteId]) createPeer(remoteId, true);
  });
  socket.on('webrtc-offer', async ({ from, offer }) => {
    if (!localStream) return;
    const pc = createPeer(from, false);
    await pc.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('webrtc-answer', { to: from, answer });
  });
  socket.on('webrtc-answer', async ({ from, answer }) => {
    if (peers[from]) await peers[from].setRemoteDescription(new RTCSessionDescription(answer));
  });
  socket.on('webrtc-ice', async ({ from, candidate }) => {
    if (peers[from]) await peers[from].addIceCandidate(new RTCIceCandidate(candidate));
  });
  socket.on('user-left-voice', (remoteId) => {
    if (peers[remoteId]) { peers[remoteId].close(); delete peers[remoteId]; }
    const el = document.getElementById('audio-' + remoteId);
    if (el) el.remove();
  });
}

function createPeer(remoteId, initiator) {
  const pc = new RTCPeerConnection(rtcConfig);
  peers[remoteId] = pc;
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit('webrtc-ice', { to: remoteId, candidate: e.candidate });
  };
  pc.ontrack = (e) => {
    let audio = document.getElementById('audio-' + remoteId);
    if (!audio) {
      audio = document.createElement('audio');
      audio.id = 'audio-' + remoteId;
      audio.autoplay = true;
      document.getElementById('audioContainer').appendChild(audio);
    }
    audio.srcObject = e.streams;
  };
  if (initiator) {
    pc.createOffer().then(offer => {
      pc.setLocalDescription(offer);
      socket.emit('webrtc-offer', { to: remoteId, offer });
    });
  }
  return pc;
}

function copyRoomLink() {
  const link = window.location.href.split('?') + '?room=' + roomId;
  navigator.clipboard?.writeText(link);
  alert('Код комнаты: ' + roomId + '\nДля совместной игры запустите сервер (node server.js) и отправьте ссылку друзьям.');
}

// Запуск отрисовки сразу при открытии
buildBoard();
drawWheel();
initNetwork();
</script>
</body>
</html>
